<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bfdbfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6ee7b7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)" />

  <!-- Subtle inner glow ring -->
  <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.4" />

  <!-- Graduation Cap - board (diamond shape) -->
  <polygon points="32,10 54,20 32,30 10,20" fill="url(#capGrad)" />

  <!-- Cap top highlight -->
  <polygon points="32,10 54,20 32,30 10,20" fill="white" opacity="0.15" />

  <!-- Graduation Cap - left side of board edge -->
  <line x1="10" y1="20" x2="10" y2="28" stroke="#bfdbfe" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Tassel string hanging from right -->
  <line x1="54" y1="20" x2="54" y2="30" stroke="#bfdbfe" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <circle cx="54" cy="32" r="2.2" fill="#facc15" />

  <!-- Chart area (small bar chart at bottom) -->
  <!-- Bar 1 -->
  <rect x="15" y="46" width="5" height="10" rx="1.5" fill="url(#chartGrad)" opacity="0.85"/>
  <!-- Bar 2 -->
  <rect x="23" y="40" width="5" height="16" rx="1.5" fill="url(#chartGrad)" opacity="0.9"/>
  <!-- Bar 3 -->
  <rect x="31" y="34" width="5" height="22" rx="1.5" fill="url(#chartGrad)"/>
  <!-- Bar 4 -->
  <rect x="39" y="28" width="5" height="28" rx="1.5" fill="#34d399" opacity="0.95"/>

  <!-- Upward trend arrow line -->
  <polyline points="17,48 25,42 33,36 43,29" fill="none" stroke="#6ee7b7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <!-- Arrow head -->
  <polygon points="43,29 48,28 44,33" fill="#6ee7b7" opacity="0.8"/>

  <!-- "R" letter monogram - subtle watermark top-left of cap area -->
  <!-- Removed to keep clean at small sizes -->
</svg>